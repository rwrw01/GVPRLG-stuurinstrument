services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: gvprlg-migrate
    networks:
      - gvprlg-internal
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: gvprlg
      DB_NAME: gvprlg
    volumes:
      - ./migrate-entrypoint.sh:/usr/local/bin/migrate-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/migrate-entrypoint.sh"]
    restart: "no"
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: gvprlg-app
    networks:
      - gvprlg-internal
      - net-fe-gvprlg
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: gvprlg
      DB_NAME: gvprlg
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "production"
    volumes:
      - ./app-entrypoint.sh:/usr/local/bin/app-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/app-entrypoint.sh"]
    secrets:
      - db_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100
    restart: on-failure:5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net-fe-gvprlg"
      - "traefik.http.routers.gvprlg.rule=Host(`spinnenweb.gvprlg.nl`)"
      - "traefik.http.routers.gvprlg.entrypoints=websecure"
      - "traefik.http.routers.gvprlg.tls.certresolver=letsencrypt"
      - "traefik.http.services.gvprlg.loadbalancer.server.port=8080"
      - "traefik.http.routers.gvprlg.middlewares=crowdsec@file,rate-limit@file"

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: gvprlg-postgres
    networks:
      - gvprlg-internal
    environment:
      POSTGRES_DB: gvprlg
      POSTGRES_USER: gvprlg
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - gvprlg-pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gvprlg"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gvprlg-internal:
    internal: true
  net-fe-gvprlg:
    external: true

volumes:
  gvprlg-pgdata:

secrets:
  db_password:
    file: ./secrets/db_password
