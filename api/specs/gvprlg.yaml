openapi: 3.1.0
info:
  title: GVPRLG Spinnenweb API
  version: 1.0.0-fase-b
security:
  - cookieAuth: []
paths:
  /api/metingen:
    get:
      summary: Lijst alle metingen
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
    post:
      summary: Maak een nieuwe meting aan voor een jaar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jaar]
              properties:
                jaar:
                  type: integer
                  minimum: 2020
                  maximum: 2100
      responses:
        '201':
          description: Aangemaakt
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldige invoer (problem+json)
        '409':
          description: Meting voor dit jaar bestaat al (problem+json)
  /api/metingen/{jaar}:
    get:
      summary: Haal één meting op met status en scores van alle ingevulde platformen
      parameters:
        - name: jaar
          in: path
          required: true
          schema: { type: integer, minimum: 2020, maximum: 2100 }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldig jaar (problem+json)
        '404':
          description: Meting niet gevonden (problem+json)
  /api/metingen/{jaar}/platformen/{platformId}:
    get:
      summary: Haal de scores van één platform binnen een meting op
      parameters:
        - name: jaar
          in: path
          required: true
          schema: { type: integer }
        - name: platformId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldig jaar of platform-id (problem+json)
        '404':
          description: Meting of platform niet gevonden (problem+json)
    put:
      summary: Sla scores en opmerkingen op voor één platform (concept of definitief)
      parameters:
        - name: jaar
          in: path
          required: true
          schema: { type: integer }
        - name: platformId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, vraagScores]
              properties:
                status:
                  type: string
                  enum: [concept, definitief]
                algemeneToelichting:
                  type: string
                vraagScores:
                  type: array
                  items:
                    type: object
                    required: [vraagId, score]
                    properties:
                      vraagId: { type: string }
                      score: { type: integer, minimum: 1, maximum: 5, nullable: true }
                      toelichting: { type: string }
      responses:
        '200':
          description: Opgeslagen
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          description: >-
            Geen schrijfrecht (problem+json, geaudit als toegang_geweigerd): account niet actief,
            invuller niet gekoppeld aan dit platform (reden geen-koppeling) of rol lezer
            (reden alleen-lezen, altijd, ook met een koppeling).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          description: Ongeldige invoer (problem+json)
        '404':
          description: Meting of platform niet gevonden (problem+json)
        '409':
          description: Platform is al definitief; een beheerder moet het eerst heropenen (problem+json)
        '422':
          description: Niet alle vragen ingevuld bij afronden (problem+json)
  /api/metingen/{jaar}/platformen/{platformId}/heropenen:
    post:
      summary: Heropen een definitief platform (terug naar concept); alleen beheerder
      description: Wordt geaudit als platform_heropend.
      security:
        - cookieAuth: []
      parameters:
        - name: jaar
          in: path
          required: true
          schema: { type: integer }
        - name: platformId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Heropend
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '400':
          description: Ongeldig jaar of platform-id (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Onbekend platform, meting niet gevonden of platform nog niet ingevuld (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Platform is niet definitief (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/overzicht:
    get:
      summary: Startscherm met de trend over alle meetjaren, voor elke actieve gebruiker
      description: >
        Per meetjaar (oudste eerst) en per platform de status, het gemiddelde per as (van de
        beantwoorde vragen van die as), het totaal (gemiddelde over alle beantwoorde vragen) en het
        aantal beantwoorde vragen; plus de afgeleide openingszin, kerncijfers, gespreksonderwerpen
        en de drie assen ten opzichte van het vorige jaar met scores. Concepten tellen mee.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overzicht' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
  /api/ik:
    get:
      summary: Gegevens van de ingelogde, actieve gebruiker
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, naam, email, rol]
                properties:
                  id: { type: string }
                  naam: { type: string }
                  email: { type: string, format: email }
                  rol: { $ref: '#/components/schemas/Rol' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
  /api/audit:
    get:
      summary: Doorzoek de auditlog (nieuwste eerst)
      description: >-
        Een beheerder ziet alle regels. Een invuller ziet alleen regels van platformen waaraan hij
        in enig meetjaar gekoppeld is; een platformId buiten die set en het actor-filter worden genegeerd.
        Een lezer krijgt hetzelfde zicht als een invuller; omdat een lezer nooit koppelingen heeft,
        is dat een lege lijst.
      security:
        - cookieAuth: []
      parameters:
        - { name: jaar, in: query, required: false, schema: { type: integer, minimum: 2020, maximum: 2100 } }
        - { name: platformId, in: query, required: false, schema: { type: string } }
        - { name: actor, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: actie, in: query, required: false, schema: { $ref: '#/components/schemas/AuditActie' } }
        - { name: limiet, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [regels]
                properties:
                  regels:
                    type: array
                    items: { $ref: '#/components/schemas/AuditRegel' }
        '400':
          $ref: '#/components/responses/OngeldigeInvoer'
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
  /api/beheer/gebruikers:
    get:
      summary: Lijst alle gebruikers met hun platformkoppelingen voor een jaar; alleen beheerder
      security:
        - cookieAuth: []
      parameters:
        - { name: jaar, in: query, required: true, schema: { type: integer, minimum: 2020, maximum: 2100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [gebruikers]
                properties:
                  gebruikers:
                    type: array
                    items: { $ref: '#/components/schemas/GebruikerMetKoppelingen' }
        '400':
          $ref: '#/components/responses/OngeldigeInvoer'
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
    post:
      summary: Registreer een voorzitter met platformkoppelingen; alleen beheerder
      description: >-
        Maakt alleen de gebruiker in de applicatie aan (status uitgenodigd). Het Keycloak-account
        wordt door de beheerder in de Keycloak-console aangemaakt; de eerste login koppelt op e-mail.
        Wordt geaudit als gebruiker_toegevoegd plus koppeling_toegevoegd per platform.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoorzitterToevoegen' }
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema:
                type: object
                required: [gebruiker]
                properties:
                  gebruiker: { $ref: '#/components/schemas/GebruikerMetKoppelingen' }
        '400':
          description: >-
            Ongeldige invoer, of een lezer met niet-lege platformIds: "Een lezer kan niet aan
            platformen gekoppeld worden." (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Geen meting voor dit jaar (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Er bestaat al een gebruiker met dit e-mailadres (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/beheer/gebruikers/{id}:
    patch:
      summary: Wijzig rol, trek toegang in, herstel toegang of ontkoppel het Keycloak-account; alleen beheerder
      description: >-
        Wordt geaudit als rol_gewijzigd, toegang_ingetrokken, toegang_hersteld of account_ontkoppeld.
        Een beheerder kan zichzelf niet degraderen, intrekken of ontkoppelen, en de laatste actieve
        beheerder kan niet worden gedegradeerd, ingetrokken of ontkoppeld (ook niet naar lezer). Het
        Keycloak-subject wordt niet in de auditregel opgenomen. Een rolwijziging naar lezer verwijdert
        in dezelfde transactie alle platformkoppelingen van de gebruiker (alle meetjaren); het aantal
        staat als koppelingenVerwijderd in het detail van de auditregel rol_gewijzigd.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GebruikerWijzigen' }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema:
                type: object
                required: [gebruiker]
                properties:
                  gebruiker: { $ref: '#/components/schemas/Gebruiker' }
        '400':
          $ref: '#/components/responses/OngeldigeInvoer'
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Gebruiker niet gevonden (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Zelfbescherming of laatste actieve beheerder (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/beheer/gebruikers/{id}/koppelingen:
    put:
      summary: Vervang de platformkoppelingen van een gebruiker voor een jaar; alleen beheerder
      description: Wordt geaudit als koppeling_toegevoegd / koppeling_verwijderd per platform.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Koppelingen' }
      responses:
        '200':
          description: Koppelingen gezet
          content:
            application/json:
              schema:
                type: object
                required: [toegevoegd, verwijderd]
                properties:
                  toegevoegd: { type: array, items: { type: string } }
                  verwijderd: { type: array, items: { type: string } }
        '400':
          description: >-
            Ongeldige invoer, of een lezer met niet-lege platformIds: "Een lezer kan niet aan
            platformen gekoppeld worden." (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Gebruiker of meting niet gevonden (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >-
        next-auth sessiecookie (HttpOnly, SameSite=Strict), gezet na inloggen via Keycloak.
        Op https heet de cookie `__Secure-next-auth.session-token`. Status, rol en
        platformkoppeling worden per verzoek uit de database gecontroleerd.
  responses:
    NietIngelogd:
      description: Geen geldige sessie (problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GeenToegang:
      description: >-
        Ingelogd maar geen toegang: account niet actief, onvoldoende rol (POST /api/metingen,
        POST .../heropenen en /api/beheer/* vereisen beheerder), geen platformkoppeling (PUT) of
        rol lezer (PUT; reden alleen-lezen, ook als er een koppeling bestaat).
        Wordt geaudit als toegang_geweigerd.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OngeldigeInvoer:
      description: Ongeldige invoer in body, query of pad (problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Overzicht:
      type: object
      required: [platformen, jaren, nuJaar, vorigeJaar, openingszin, kerncijfers, gespreksonderwerpen, assen]
      properties:
        platformen:
          type: array
          items:
            type: object
            required: [id, naam, kleur]
            properties:
              id: { type: string }
              naam: { type: string }
              kleur: { type: string, description: Vaste lijnkleur in de trendgrafiek }
        jaren:
          type: array
          items: { $ref: '#/components/schemas/JaarCijfers' }
        nuJaar: { type: [integer, 'null'], description: Nieuwste jaar met scores }
        vorigeJaar: { type: [integer, 'null'], description: Jaar met scores daarvoor }
        openingszin: { type: string }
        kerncijfers:
          oneOf:
            - $ref: '#/components/schemas/Kerncijfers'
            - type: 'null'
        gespreksonderwerpen:
          type: array
          maxItems: 4
          items:
            type: object
            required: [soort, titel, toelichting]
            properties:
              soort: { type: string, enum: [daling, concept, niet-gestart, stijging] }
              titel: { type: string }
              toelichting: { type: string }
        assen:
          type: array
          items:
            type: object
            required: [id, naam, nu, vorige, aantal, vergeleken]
            description: >
              Over de platformen die in beide jaren definitief zijn (vergeleken=true), anders over de
              definitieve platformen van het nieuwste jaar zonder vergelijking.
            properties:
              id: { type: string }
              naam: { type: string }
              nu: { type: [number, 'null'] }
              vorige: { type: [number, 'null'] }
              aantal: { type: integer, description: Aantal platformen achter de cijfers }
              vergeleken: { type: boolean }
    JaarCijfers:
      type: object
      required: [jaar, voortgang, aantalDefinitief, gemiddelde, perAs, platformen]
      properties:
        jaar: { type: integer }
        voortgang: { type: string, description: '"<definitief>/<platformen>" of "afgerond"', examples: ['3/5', afgerond] }
        aantalDefinitief: { type: integer }
        gemiddelde: { type: [number, 'null'] }
        perAs:
          type: object
          additionalProperties: { type: [number, 'null'] }
        platformen:
          type: array
          items:
            type: object
            required: [platformId, status, perAs, totaal, beantwoord]
            properties:
              platformId: { type: string }
              status: { type: string, enum: [definitief, concept, niet-gestart] }
              perAs:
                type: object
                additionalProperties: { type: [number, 'null'] }
              totaal: { type: [number, 'null'] }
              beantwoord: { type: integer, minimum: 0 }
    AsScore:
      type: object
      required: [platformId, asId, waarde, vorige, verschil]
      properties:
        platformId: { type: string }
        asId: { type: string }
        waarde: { type: number }
        vorige: { type: [number, 'null'] }
        verschil: { type: [number, 'null'] }
    Kerncijfers:
      type: object
      description: >
        Afgeleide uitspraken gebruiken alleen definitieve platformen; een vergelijking alleen de
        platformen die in beide jaren definitief zijn. Stijging en daling worden bepaald op de
        waarden afgerond op één decimaal.
      required: [jaar, gemiddelde, aantalGemiddelde, vorigeJaar, vergelijking, aantalPlatformen, aantalDefinitief, aantalConcept, aantalNietGestart, stijger, groeikans]
      properties:
        jaar: { type: integer }
        gemiddelde: { type: [number, 'null'], description: Gemiddelde van de definitieve platformen }
        aantalGemiddelde: { type: integer }
        vorigeJaar: { type: [integer, 'null'] }
        vergelijking:
          oneOf:
            - type: object
              required: [nu, vorige, aantal]
              properties:
                nu: { type: number }
                vorige: { type: number }
                aantal: { type: integer, minimum: 1 }
            - type: 'null'
        aantalPlatformen: { type: integer }
        aantalDefinitief: { type: integer }
        aantalConcept: { type: integer }
        aantalNietGestart: { type: integer }
        stijger:
          oneOf:
            - type: object
              required: [platformId, waarde, vorige, verschil]
              properties:
                platformId: { type: string }
                waarde: { type: number }
                vorige: { type: number }
                verschil: { type: number }
            - type: 'null'
        groeikans:
          oneOf:
            - $ref: '#/components/schemas/AsScore'
            - type: 'null'
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Rol:
      type: string
      description: >-
        invuller schrijft gekoppelde platformen, beheerder alles; lezer ziet alles wat een invuller
        ziet (inclusief concepten) maar mag niets schrijven en heeft nooit platformkoppelingen.
      enum: [invuller, beheerder, lezer]
    Gebruiker:
      type: object
      description: Gebruiker zoals de beheer-API die toont; het Keycloak-subject zelf wordt nooit getoond.
      required: [id, email, naam, rol, status, gekoppeld, laatsteLogin]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        naam: { type: string }
        rol: { $ref: '#/components/schemas/Rol' }
        status: { type: string, enum: [uitgenodigd, actief, ingetrokken] }
        gekoppeld: { type: boolean, description: Er is een Keycloak-account aan deze gebruiker gebonden }
        laatsteLogin: { type: [string, 'null'], format: date-time }
    GebruikerMetKoppelingen:
      allOf:
        - $ref: '#/components/schemas/Gebruiker'
        - type: object
          required: [platformIds]
          properties:
            platformIds: { type: array, items: { type: string } }
    VoorzitterToevoegen:
      type: object
      required: [email, naam, rol, jaar, platformIds]
      properties:
        email: { type: string, format: email, maxLength: 254, description: Wordt getrimd en lowercase opgeslagen }
        naam: { type: string, minLength: 1, maxLength: 200 }
        rol: { $ref: '#/components/schemas/Rol' }
        jaar: { type: integer, minimum: 2020, maximum: 2100 }
        platformIds:
          type: array
          maxItems: 5
          description: Bekende platform-id's; mag leeg zijn
          items: { type: string }
    GebruikerWijzigen:
      oneOf:
        - type: object
          required: [actie, rol]
          properties:
            actie: { const: rol }
            rol: { $ref: '#/components/schemas/Rol' }
        - type: object
          required: [actie]
          properties:
            actie: { type: string, enum: [intrekken, herstellen, ontkoppelAccount] }
    Koppelingen:
      type: object
      required: [jaar, platformIds]
      properties:
        jaar: { type: integer, minimum: 2020, maximum: 2100 }
        platformIds:
          type: array
          maxItems: 5
          items: { type: string }
    AuditActie:
      type: string
      enum:
        - gebruiker_toegevoegd
        - eerste_login
        - ingelogd
        - uitgelogd
        - koppeling_toegevoegd
        - koppeling_verwijderd
        - rol_gewijzigd
        - toegang_ingetrokken
        - toegang_hersteld
        - toegang_geweigerd
        - platform_heropend
        - account_ontkoppeld
        - platform_opgeslagen_concept
        - platform_afgerond
    AuditRegel:
      type: object
      required: [id, tijdstip, actor, actorNaam, actorEmail, actie, doelType, doelId, detail]
      properties:
        id: { type: string }
        tijdstip: { type: string, format: date-time }
        actor:
          type: string
          description: Gebruiker.id of the actor, or a non-user value (seed script, `onbekend`, Keycloak sub of a refused login)
        actorNaam:
          type: [string, 'null']
          description: Name of the user behind `actor`; null when `actor` is not a known user
        actorEmail:
          type: [string, 'null']
          description: E-mail of the user behind `actor`; null when `actor` is not a known user
        actie: { $ref: '#/components/schemas/AuditActie' }
        doelType: { type: string }
        doelId: { type: string }
        detail: { type: string }
