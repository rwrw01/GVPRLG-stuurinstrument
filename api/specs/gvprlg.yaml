openapi: 3.1.0
info:
  title: GVPRLG Spinnenweb API
  version: 1.1.0-vragenlijst
security:
  - cookieAuth: []
paths:
  /api/metingen:
    get:
      summary: Lijst alle metingen
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
    post:
      summary: Maak een nieuwe meting aan voor een jaar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jaar]
              properties:
                jaar:
                  type: integer
                  minimum: 2020
                  maximum: 2100
      responses:
        '201':
          description: Aangemaakt
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldige invoer (problem+json)
        '409':
          description: Meting voor dit jaar bestaat al (problem+json)
  /api/metingen/{jaar}:
    get:
      summary: Haal één meting op met status, scores en aanwezigen van alle ingevulde businessunits
      description: Antwoord { meting { id, jaar, aangemaakt, vastgelegd, businessUnits } }; businessUnits per businessunit-id een BusinessUnitRij.
      parameters:
        - name: jaar
          in: path
          required: true
          schema: { type: integer, minimum: 2020, maximum: 2100 }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldig jaar (problem+json)
        '404':
          description: Meting niet gevonden (problem+json)
  /api/metingen/{jaar}/vragenlijst:
    get:
      summary: De vragenlijst van één meetjaar, voor elke actieve gebruiker
      description: >
        Een vastgelegd jaar geeft zijn eigen kopie (assen, vragen, platformen en businessunits zoals
        bij de eerste opslag van dat jaar), een open jaar de actuele niet-vervallen lijst (alleen
        assen met actieve vragen). Elk item draagt zijn stabiele id.
      parameters:
        - $ref: '#/components/parameters/Jaar'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [vragenlijst]
                properties:
                  vragenlijst: { $ref: '#/components/schemas/Vragenlijst' }
        '400':
          description: Ongeldig jaar (problem+json)
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Meting niet gevonden (problem+json)
  /api/metingen/{jaar}/businessunits/{businessUnitId}:
    get:
      summary: Haal de ingevulde rij van één businessunit binnen een meting op
      parameters:
        - $ref: '#/components/parameters/Jaar'
        - $ref: '#/components/parameters/BusinessUnitId'
      responses:
        '200':
          description: OK; businessUnit is null zolang de businessunit nog niet is ingevuld
          content:
            application/json:
              schema:
                type: object
                required: [businessUnit, unit]
                properties:
                  businessUnit:
                    oneOf:
                      - $ref: '#/components/schemas/BusinessUnitRij'
                      - type: 'null'
                  unit: { $ref: '#/components/schemas/LijstBusinessUnit' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldig jaar of businessunit-id (problem+json)
        '404':
          description: Meting niet gevonden, of de businessunit hoort niet bij de vragenlijst van dat jaar (problem+json)
    put:
      summary: Sla scores, opmerkingen en aanwezigen op voor één businessunit (concept of definitief)
      description: >
        De eerste opslag van een meetjaar (ook een concept zonder scores) legt in dezelfde transactie
        de vragenlijst van dat jaar vast. Vraag-ids worden gecontroleerd tegen de lijst op het moment
        van opslaan.
      parameters:
        - $ref: '#/components/parameters/Jaar'
        - $ref: '#/components/parameters/BusinessUnitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, vraagScores]
              properties:
                status:
                  type: string
                  enum: [concept, definitief]
                algemeneToelichting:
                  type: string
                  maxLength: 5000
                aanwezigen:
                  type: string
                  maxLength: 2000
                  description: Vrije tekst, wie erbij waren
                vraagScores:
                  type: array
                  maxItems: 200
                  description: Elke vraag hoogstens één keer
                  items:
                    type: object
                    required: [vraagId, score]
                    properties:
                      vraagId: { type: string, maxLength: 64 }
                      score: { type: [integer, 'null'], minimum: 1, maximum: 5 }
                      toelichting: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Opgeslagen
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          description: >-
            Geen schrijfrecht (problem+json, geaudit als toegang_geweigerd): account niet actief,
            invuller niet gekoppeld aan het platform van deze businessunit (reden geen-koppeling) of
            rol lezer (reden alleen-lezen, altijd, ook met een koppeling).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400':
          description: Ongeldige invoer, of "Deze vraag hoort niet bij de vragenlijst van {jaar}." (problem+json)
        '404':
          description: Meting niet gevonden, of de businessunit hoort niet bij de vragenlijst van dat jaar (problem+json)
        '409':
          description: >-
            Businessunit is al definitief (een beheerder moet eerst heropenen), de indeling is net
            gewijzigd, of de vragenlijst heeft minder dan 3 vragen om vast te leggen (problem+json)
        '422':
          description: Niet alle vragen van de vragenlijst van dat jaar ingevuld bij afronden (problem+json)
  /api/metingen/{jaar}/businessunits/{businessUnitId}/heropenen:
    post:
      summary: Heropen een definitieve businessunit (terug naar concept); alleen beheerder
      description: Wordt geaudit als platform_heropend.
      parameters:
        - $ref: '#/components/parameters/Jaar'
        - $ref: '#/components/parameters/BusinessUnitId'
      responses:
        '200':
          description: Heropend
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '400':
          description: Ongeldig jaar of businessunit-id (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Meting niet gevonden, businessunit niet in de lijst van dat jaar of nog niet ingevuld (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Businessunit is niet definitief (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/overzicht:
    get:
      summary: Startscherm met de trend over alle meetjaren, voor elke actieve gebruiker
      description: >
        Per meetjaar (oudste eerst) en per businessunit van de vragenlijst van dat jaar (met naam,
        kleur en platformnaam van dat jaar) de status, het gemiddelde per as (van de
        beantwoorde vragen van die as), het totaal (gemiddelde over alle beantwoorde vragen) en het
        aantal beantwoorde vragen; plus de afgeleide openingszin, kerncijfers, gespreksonderwerpen
        en de drie assen ten opzichte van het vorige jaar met scores. Concepten tellen mee.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overzicht' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
  /api/ik:
    get:
      summary: Gegevens van de ingelogde, actieve gebruiker
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, naam, email, rol]
                properties:
                  id: { type: string }
                  naam: { type: string }
                  email: { type: string, format: email }
                  rol: { $ref: '#/components/schemas/Rol' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
  /api/audit:
    get:
      summary: Doorzoek de auditlog (nieuwste eerst)
      description: >-
        Een beheerder ziet alle regels. Een invuller ziet alleen regels van platformen waaraan hij
        in enig meetjaar gekoppeld is; een platformId buiten die set en het actor-filter worden genegeerd.
        Een lezer krijgt hetzelfde zicht als een invuller; omdat een lezer nooit koppelingen heeft,
        is dat een lege lijst.
      security:
        - cookieAuth: []
      parameters:
        - { name: jaar, in: query, required: false, schema: { type: integer, minimum: 2020, maximum: 2100 } }
        - { name: platformId, in: query, required: false, schema: { type: string } }
        - { name: actor, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: actie, in: query, required: false, schema: { $ref: '#/components/schemas/AuditActie' } }
        - { name: limiet, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [regels]
                properties:
                  regels:
                    type: array
                    items: { $ref: '#/components/schemas/AuditRegel' }
        '400':
          $ref: '#/components/responses/OngeldigeInvoer'
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
  /api/beheer/gebruikers:
    get:
      summary: Lijst alle gebruikers met hun platformkoppelingen voor een jaar; alleen beheerder
      security:
        - cookieAuth: []
      parameters:
        - { name: jaar, in: query, required: true, schema: { type: integer, minimum: 2020, maximum: 2100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [gebruikers]
                properties:
                  gebruikers:
                    type: array
                    items: { $ref: '#/components/schemas/GebruikerMetKoppelingen' }
        '400':
          $ref: '#/components/responses/OngeldigeInvoer'
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
    post:
      summary: Registreer een gebruiker met platformkoppelingen; alleen beheerder
      description: >-
        Maakt alleen de gebruiker in de applicatie aan (status uitgenodigd). Het Keycloak-account
        wordt door de beheerder in de Keycloak-console aangemaakt; de eerste login koppelt op e-mail.
        Wordt geaudit als gebruiker_toegevoegd plus koppeling_toegevoegd per platform.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GebruikerToevoegen' }
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema:
                type: object
                required: [gebruiker]
                properties:
                  gebruiker: { $ref: '#/components/schemas/GebruikerMetKoppelingen' }
        '400':
          description: >-
            Ongeldige invoer, een platform dat niet meedoet in dat meetjaar, of een lezer met niet-lege platformIds: "Een lezer kan niet aan
            platformen gekoppeld worden." (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Geen meting voor dit jaar (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Er bestaat al een gebruiker met dit e-mailadres (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/beheer/gebruikers/{id}:
    patch:
      summary: Wijzig rol, trek toegang in, herstel toegang of ontkoppel het Keycloak-account; alleen beheerder
      description: >-
        Wordt geaudit als rol_gewijzigd, toegang_ingetrokken, toegang_hersteld of account_ontkoppeld.
        Een beheerder kan zichzelf niet degraderen, intrekken of ontkoppelen, en de laatste actieve
        beheerder kan niet worden gedegradeerd, ingetrokken of ontkoppeld (ook niet naar lezer). Het
        Keycloak-subject wordt niet in de auditregel opgenomen. Een rolwijziging naar lezer verwijdert
        in dezelfde transactie alle platformkoppelingen van de gebruiker (alle meetjaren); het aantal
        staat als koppelingenVerwijderd in het detail van de auditregel rol_gewijzigd.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GebruikerWijzigen' }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema:
                type: object
                required: [gebruiker]
                properties:
                  gebruiker: { $ref: '#/components/schemas/Gebruiker' }
        '400':
          $ref: '#/components/responses/OngeldigeInvoer'
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Gebruiker niet gevonden (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Zelfbescherming of laatste actieve beheerder (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/beheer/gebruikers/{id}/koppelingen:
    put:
      summary: Vervang de platformkoppelingen van een gebruiker voor een jaar; alleen beheerder
      description: Wordt geaudit als koppeling_toegevoegd / koppeling_verwijderd per platform.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Koppelingen' }
      responses:
        '200':
          description: Koppelingen gezet
          content:
            application/json:
              schema:
                type: object
                required: [toegevoegd, verwijderd]
                properties:
                  toegevoegd: { type: array, items: { type: string } }
                  verwijderd: { type: array, items: { type: string } }
        '400':
          description: >-
            Ongeldige invoer, een platform dat niet meedoet in dat meetjaar, of een lezer met niet-lege platformIds: "Een lezer kan niet aan
            platformen gekoppeld worden." (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          description: Gebruiker of meting niet gevonden (problem+json)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/beheer/catalogus:
    get:
      summary: De volledige vragenlijst en businessunits (ook vervallen items) en per meetjaar of het vastligt
      description: >
        Voor elke actieve gebruiker; alleen een beheerder kan wijzigen. Assen met hun vragen,
        platformen met hun businessunits, alles in volgorde. heeftInhoud geeft aan of een vastgelegd
        jaar al scores, toelichtingen of aanwezigen bevat (dan kan het niet meer worden vrijgegeven).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogus' }
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
  /api/beheer/assen:
    post:
      summary: Voeg een as toe; alleen beheerder
      description: >
        Krijgt een gegenereerde sleutel, de volgende vrije kleur uit het assenpalet (6 kleuren, een
        kleur wordt nooit hergebruikt) en de laatste plek. Geaudit als catalogus_toegevoegd.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naam]
              properties:
                naam: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusAs' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '409':
          description: Geen kleur meer vrij (problem+json)
  /api/beheer/assen/{id}:
    patch:
      summary: Hernoem een as, verwijder haar (vervallen) of maak haar weer actief; alleen beheerder
      description: >
        Een as met actieve vragen kan niet vervallen (409). Vastgelegde jaren houden hun kopie; open
        jaren nemen de wijziging direct over. Geaudit als catalogus_gewijzigd met oude en nieuwe waarde.
      parameters:
        - $ref: '#/components/parameters/CatalogusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                naam: { type: string, minLength: 1, maxLength: 100 }
                vervallen: { type: boolean }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusAs' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/assen/{id}/verplaats:
    post:
      summary: Verplaats een actieve as één plek omhoog of omlaag; alleen beheerder
      parameters:
        - $ref: '#/components/parameters/CatalogusId'
      requestBody: { $ref: '#/components/requestBodies/Verplaats' }
      responses:
        '200':
          description: Verplaatst
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusAs' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/vragen:
    post:
      summary: Voeg een vraag toe aan een actieve as; alleen beheerder
      description: Begint zonder scores en zonder trend. Geaudit als catalogus_toegevoegd.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asId, kort, tekst]
              properties:
                asId: { type: string }
                kort: { type: string, minLength: 1, maxLength: 22 }
                tekst: { type: string, minLength: 1, maxLength: 1000 }
                nds: { type: [string, 'null'], description: Een NDS-thema uit de vaste lijst in de code }
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusVraag' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/vragen/{id}:
    patch:
      summary: Wijzig een vraag, verplaats haar naar een andere as, verwijder of herstel haar; alleen beheerder
      description: >
        Een wijziging van tekst, kort label of NDS-thema houdt dezelfde vraag (de trend loopt door).
        Geweigerd (409) als er daarna minder dan 3 actieve vragen zijn, of bij herstellen of
        verplaatsen naar een verwijderde as. Geaudit als catalogus_gewijzigd.
      parameters:
        - $ref: '#/components/parameters/CatalogusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                asId: { type: string }
                kort: { type: string, minLength: 1, maxLength: 22 }
                tekst: { type: string, minLength: 1, maxLength: 1000 }
                nds: { type: [string, 'null'] }
                vervallen: { type: boolean }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusVraag' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/vragen/{id}/verplaats:
    post:
      summary: Verplaats een actieve vraag één plek binnen haar as; alleen beheerder
      parameters:
        - $ref: '#/components/parameters/CatalogusId'
      requestBody: { $ref: '#/components/requestBodies/Verplaats' }
      responses:
        '200':
          description: Verplaatst
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusVraag' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/platformen:
    post:
      summary: Voeg een gebruikersplatform toe; alleen beheerder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naam]
              properties:
                naam: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusPlatform' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
  /api/beheer/platformen/{id}:
    patch:
      summary: Hernoem een platform, laat het vervallen of maak het weer actief; alleen beheerder
      description: >
        Een platform met actieve businessunits kan niet vervallen (409). Bij vervallen vervallen de
        koppelingen van invullers aan dat platform in open meetjaren mee (geaudit als
        koppeling_verwijderd); vastgelegde jaren blijven ongewijzigd.
      parameters:
        - $ref: '#/components/parameters/CatalogusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                naam: { type: string, minLength: 1, maxLength: 100 }
                vervallen: { type: boolean }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusPlatform' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/platformen/{id}/verplaats:
    post:
      summary: Verplaats een actief platform één plek omhoog of omlaag; alleen beheerder
      parameters:
        - $ref: '#/components/parameters/CatalogusId'
      requestBody: { $ref: '#/components/requestBodies/Verplaats' }
      responses:
        '200':
          description: Verplaatst
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusPlatform' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/businessunits:
    post:
      summary: Voeg een businessunit toe aan een actief platform; alleen beheerder
      description: >
        Begint kaal (geen scores, geen trend). Krijgt de volgende vrije kleur uit het palet van 8;
        daarboven 409. Geaudit als catalogus_toegevoegd.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platformId, naam]
              properties:
                platformId: { type: string }
                naam: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusBusinessUnit' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/businessunits/{id}:
    patch:
      summary: Hernoem een businessunit, verplaats haar naar een ander platform, laat haar vervallen of herstel haar; alleen beheerder
      description: >
        Een vervallen businessunit doet niet mee in open meetjaren en blijft zichtbaar in de jaren
        waarin ze vastlag. Herstellen of verplaatsen naar een vervallen platform: 409.
      parameters:
        - $ref: '#/components/parameters/CatalogusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                platformId: { type: string }
                naam: { type: string, minLength: 1, maxLength: 100 }
                vervallen: { type: boolean }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusBusinessUnit' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/businessunits/{id}/verplaats:
    post:
      summary: Verplaats een actieve businessunit één plek binnen haar platform; alleen beheerder
      parameters:
        - $ref: '#/components/parameters/CatalogusId'
      requestBody: { $ref: '#/components/requestBodies/Verplaats' }
      responses:
        '200':
          description: Verplaatst
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogusBusinessUnit' }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404': { $ref: '#/components/responses/CatalogusNietGevonden' }
        '409': { $ref: '#/components/responses/CatalogusRegel' }
  /api/beheer/metingen/{jaar}/vrijgeven:
    post:
      summary: Zet de vragenlijst van een vastgelegd meetjaar weer open; alleen beheerder
      description: >
        Alleen zolang het jaar geen enkele score, toelichting, algemene toelichting of aanwezigen
        bevat. De lege rijen en de kopie vervallen; het jaar volgt weer de actuele lijst. Geaudit als
        meting_vrijgegeven.
      parameters:
        - $ref: '#/components/parameters/Jaar'
      responses:
        '200':
          description: Vrijgegeven
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/CatalogusOngeldig' }
        '401': { $ref: '#/components/responses/NietIngelogd' }
        '403': { $ref: '#/components/responses/CatalogusGeenBeheerder' }
        '404':
          description: Meting niet gevonden (problem+json)
        '409':
          description: Het jaar ligt niet vast, of bevat al scores, toelichtingen of aanwezigen (problem+json)
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >-
        next-auth sessiecookie (HttpOnly, SameSite=Strict), gezet na inloggen via Keycloak.
        Op https heet de cookie `__Secure-next-auth.session-token`. Status, rol en
        platformkoppeling worden per verzoek uit de database gecontroleerd.
  parameters:
    Jaar:
      name: jaar
      in: path
      required: true
      schema: { type: integer, minimum: 2020, maximum: 2100 }
    BusinessUnitId:
      name: businessUnitId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    CatalogusId:
      name: id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
  requestBodies:
    Verplaats:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [richting]
            properties:
              richting: { type: string, enum: [omhoog, omlaag] }
  responses:
    CatalogusOngeldig:
      description: Ongeldige invoer met een Nederlandse melding, bijvoorbeeld "Het korte label mag maximaal 22 tekens zijn." (problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CatalogusGeenBeheerder:
      description: Geen beheerder (problem+json); geaudit als toegang_geweigerd met vereist=beheerder
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CatalogusNietGevonden:
      description: Onbekende as, vraag, platform of businessunit (problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CatalogusRegel:
      description: >
        Een regel staat de wijziging niet toe (problem+json, Nederlandse melding): minder dan 3 actieve
        vragen, as met actieve vragen, platform met actieve businessunits, herstellen of verplaatsen
        onder een vervallen as of platform, geen kleur meer vrij, al bovenaan of onderaan.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NietIngelogd:
      description: Geen geldige sessie (problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GeenToegang:
      description: >-
        Ingelogd maar geen toegang: account niet actief, onvoldoende rol (POST /api/metingen,
        POST .../heropenen en /api/beheer/* vereisen beheerder), geen platformkoppeling (PUT) of
        rol lezer (PUT; reden alleen-lezen, ook als er een koppeling bestaat).
        Wordt geaudit als toegang_geweigerd.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OngeldigeInvoer:
      description: Ongeldige invoer in body, query of pad (problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Vragenlijst:
      type: object
      description: De vragenlijst van één meetjaar, alles in volgorde.
      required: [jaar, vastgelegd, assen, platformen, businessUnits]
      properties:
        jaar: { type: integer }
        vastgelegd: { type: boolean, description: True zodra de eerste rij van het jaar is opgeslagen }
        assen:
          type: array
          items:
            type: object
            required: [id, naam, kleur, vragen]
            properties:
              id: { type: string }
              naam: { type: string }
              kleur: { type: string }
              vragen:
                type: array
                items:
                  type: object
                  required: [id, asId, kort, tekst]
                  properties:
                    id: { type: string }
                    asId: { type: string }
                    kort: { type: string, maxLength: 22 }
                    tekst: { type: string }
                    nds: { type: string }
        platformen:
          type: array
          items:
            type: object
            required: [id, naam, businessUnitIds]
            properties:
              id: { type: string }
              naam: { type: string }
              businessUnitIds: { type: array, items: { type: string } }
        businessUnits:
          type: array
          items: { $ref: '#/components/schemas/LijstBusinessUnit' }
    LijstBusinessUnit:
      type: object
      required: [id, platformId, naam, kleur]
      properties:
        id: { type: string }
        platformId: { type: string }
        naam: { type: string }
        kleur: { type: string }
    BusinessUnitRij:
      type: object
      required: [status, algemeneToelichting, aanwezigen, laatstGewijzigdDoor, laatstGewijzigdOp, scoresPerAs, toelichtingen]
      properties:
        status: { type: string, enum: [concept, definitief] }
        algemeneToelichting: { type: string }
        aanwezigen: { type: string }
        laatstGewijzigdDoor: { type: string }
        laatstGewijzigdOp: { type: string, format: date-time }
        scoresPerAs:
          type: object
          description: Per as-id per vraag-id de score (of null)
          additionalProperties:
            type: object
            additionalProperties: { type: [integer, 'null'] }
        toelichtingen:
          type: object
          additionalProperties: { type: string }
    Overzicht:
      type: object
      required: [businessUnits, jaren, nuJaar, vorigeJaar, openingszin, kerncijfers, gespreksonderwerpen, assen]
      properties:
        businessUnits:
          type: array
          description: >
            Elke businessunit die in minstens één jaar meedoet: eerst die van het nieuwste jaar in
            volgorde, daarna die alleen in oudere jaren meededen (met naam en kleur van hun laatste jaar).
          items:
            type: object
            required: [id, naam, kleur, platformNaam]
            properties:
              id: { type: string }
              naam: { type: string }
              kleur: { type: string, description: Vaste lijnkleur in de trendgrafiek }
              platformNaam: { type: string }
        jaren:
          type: array
          items: { $ref: '#/components/schemas/JaarCijfers' }
        nuJaar: { type: [integer, 'null'], description: Nieuwste jaar met scores }
        vorigeJaar: { type: [integer, 'null'], description: Jaar met scores daarvoor }
        openingszin: { type: string }
        kerncijfers:
          oneOf:
            - $ref: '#/components/schemas/Kerncijfers'
            - type: 'null'
        gespreksonderwerpen:
          type: array
          maxItems: 4
          items:
            type: object
            required: [soort, titel, toelichting]
            properties:
              soort: { type: string, enum: [daling, concept, niet-gestart, stijging] }
              titel: { type: string }
              toelichting: { type: string }
        assen:
          type: array
          items:
            type: object
            required: [id, naam, nu, vorige, aantal, vergeleken]
            description: >
              De assen van het nieuwste jaar met scores, vergeleken op as-id. Over de businessunits die
              in beide jaren definitief zijn (vergeleken=true), anders over de definitieve businessunits
              van het nieuwste jaar zonder vergelijking.
            properties:
              id: { type: string }
              naam: { type: string }
              nu: { type: [number, 'null'] }
              vorige: { type: [number, 'null'] }
              aantal: { type: integer, description: Aantal businessunits achter de cijfers }
              vergeleken: { type: boolean }
    JaarCijfers:
      type: object
      required: [jaar, vastgelegd, voortgang, aantalDefinitief, aantalVragen, gemiddelde, perAs, assen, businessUnits]
      properties:
        jaar: { type: integer }
        vastgelegd: { type: boolean }
        voortgang: { type: string, description: '"<definitief>/<businessunits>" of "afgerond"', examples: ['3/5', afgerond] }
        aantalDefinitief: { type: integer }
        aantalVragen: { type: integer, description: Aantal vragen in de vragenlijst van dat jaar }
        gemiddelde: { type: [number, 'null'] }
        perAs:
          type: object
          additionalProperties: { type: [number, 'null'] }
        assen:
          type: array
          items:
            type: object
            required: [id, naam, kleur]
            properties:
              id: { type: string }
              naam: { type: string }
              kleur: { type: string }
        businessUnits:
          type: array
          items:
            type: object
            required: [businessUnitId, naam, kleur, platformId, platformNaam, status, perAs, totaal, beantwoord]
            properties:
              businessUnitId: { type: string }
              naam: { type: string }
              kleur: { type: string }
              platformId: { type: string }
              platformNaam: { type: string }
              status: { type: string, enum: [definitief, concept, niet-gestart] }
              perAs:
                type: object
                additionalProperties: { type: [number, 'null'] }
              totaal: { type: [number, 'null'] }
              beantwoord: { type: integer, minimum: 0 }
    AsScore:
      type: object
      required: [businessUnitId, asId, waarde, vorige, verschil]
      properties:
        businessUnitId: { type: string }
        asId: { type: string }
        waarde: { type: number }
        vorige: { type: [number, 'null'] }
        verschil: { type: [number, 'null'] }
    Kerncijfers:
      type: object
      description: >
        Afgeleide uitspraken gebruiken alleen definitieve businessunits; een vergelijking alleen de
        businessunits die in beide jaren definitief zijn. Stijging en daling worden bepaald op de
        waarden afgerond op één decimaal.
      required: [jaar, gemiddelde, aantalGemiddelde, vorigeJaar, vergelijking, aantalBusinessUnits, aantalDefinitief, aantalConcept, aantalNietGestart, stijger, groeikans]
      properties:
        jaar: { type: integer }
        gemiddelde: { type: [number, 'null'], description: Gemiddelde van de definitieve businessunits }
        aantalGemiddelde: { type: integer }
        vorigeJaar: { type: [integer, 'null'] }
        vergelijking:
          oneOf:
            - type: object
              required: [nu, vorige, aantal]
              properties:
                nu: { type: number }
                vorige: { type: number }
                aantal: { type: integer, minimum: 1 }
            - type: 'null'
        aantalBusinessUnits: { type: integer }
        aantalDefinitief: { type: integer }
        aantalConcept: { type: integer }
        aantalNietGestart: { type: integer }
        stijger:
          oneOf:
            - type: object
              required: [businessUnitId, waarde, vorige, verschil]
              properties:
                businessUnitId: { type: string }
                waarde: { type: number }
                vorige: { type: number }
                verschil: { type: number }
            - type: 'null'
        groeikans:
          oneOf:
            - $ref: '#/components/schemas/AsScore'
            - type: 'null'
    CatalogusAs:
      type: object
      required: [id, naam, kleur, volgorde, vervallen]
      properties:
        id: { type: string }
        naam: { type: string }
        kleur: { type: string }
        volgorde: { type: integer }
        vervallen: { type: boolean }
    CatalogusVraag:
      type: object
      required: [id, asId, kort, tekst, nds, volgorde, vervallen]
      properties:
        id: { type: string }
        asId: { type: string }
        kort: { type: string, maxLength: 22 }
        tekst: { type: string }
        nds: { type: [string, 'null'] }
        volgorde: { type: integer, description: Volgorde binnen de as }
        vervallen: { type: boolean }
    CatalogusPlatform:
      type: object
      required: [id, naam, volgorde, vervallen]
      properties:
        id: { type: string }
        naam: { type: string }
        volgorde: { type: integer }
        vervallen: { type: boolean }
    CatalogusBusinessUnit:
      type: object
      required: [id, platformId, naam, kleur, volgorde, vervallen]
      properties:
        id: { type: string }
        platformId: { type: string }
        naam: { type: string }
        kleur: { type: string }
        volgorde: { type: integer, description: Volgorde binnen het platform }
        vervallen: { type: boolean }
    Catalogus:
      type: object
      required: [assen, platformen, metingen]
      properties:
        assen:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CatalogusAs'
              - type: object
                required: [vragen]
                properties:
                  vragen: { type: array, items: { $ref: '#/components/schemas/CatalogusVraag' } }
        platformen:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CatalogusPlatform'
              - type: object
                required: [businessUnits]
                properties:
                  businessUnits: { type: array, items: { $ref: '#/components/schemas/CatalogusBusinessUnit' } }
        metingen:
          type: array
          items:
            type: object
            required: [jaar, vastgelegd, heeftInhoud]
            properties:
              jaar: { type: integer }
              vastgelegd: { type: boolean }
              heeftInhoud: { type: boolean }
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Rol:
      type: string
      description: >-
        invuller schrijft gekoppelde platformen, beheerder alles; lezer ziet alles wat een invuller
        ziet (inclusief concepten) maar mag niets schrijven en heeft nooit platformkoppelingen.
      enum: [invuller, beheerder, lezer]
    Gebruiker:
      type: object
      description: Gebruiker zoals de beheer-API die toont; het Keycloak-subject zelf wordt nooit getoond.
      required: [id, email, naam, rol, status, gekoppeld, laatsteLogin]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        naam: { type: string }
        rol: { $ref: '#/components/schemas/Rol' }
        status: { type: string, enum: [uitgenodigd, actief, ingetrokken] }
        gekoppeld: { type: boolean, description: Er is een Keycloak-account aan deze gebruiker gebonden }
        laatsteLogin: { type: [string, 'null'], format: date-time }
    GebruikerMetKoppelingen:
      allOf:
        - $ref: '#/components/schemas/Gebruiker'
        - type: object
          required: [platformIds]
          properties:
            platformIds: { type: array, items: { type: string } }
    GebruikerToevoegen:
      type: object
      required: [email, naam, rol, jaar, platformIds]
      properties:
        email: { type: string, format: email, maxLength: 254, description: Wordt getrimd en lowercase opgeslagen }
        naam: { type: string, minLength: 1, maxLength: 200 }
        rol: { $ref: '#/components/schemas/Rol' }
        jaar: { type: integer, minimum: 2020, maximum: 2100 }
        platformIds:
          type: array
          maxItems: 5
          description: Bekende platform-id's; mag leeg zijn
          items: { type: string }
    GebruikerWijzigen:
      oneOf:
        - type: object
          required: [actie, rol]
          properties:
            actie: { const: rol }
            rol: { $ref: '#/components/schemas/Rol' }
        - type: object
          required: [actie]
          properties:
            actie: { type: string, enum: [intrekken, herstellen, ontkoppelAccount] }
    Koppelingen:
      type: object
      required: [jaar, platformIds]
      properties:
        jaar: { type: integer, minimum: 2020, maximum: 2100 }
        platformIds:
          type: array
          maxItems: 5
          items: { type: string }
    AuditActie:
      type: string
      enum:
        - gebruiker_toegevoegd
        - eerste_login
        - ingelogd
        - uitgelogd
        - koppeling_toegevoegd
        - koppeling_verwijderd
        - rol_gewijzigd
        - toegang_ingetrokken
        - toegang_hersteld
        - toegang_geweigerd
        - platform_heropend
        - account_ontkoppeld
        - platform_opgeslagen_concept
        - platform_afgerond
        - catalogus_toegevoegd
        - catalogus_gewijzigd
        - catalogus_verplaatst
        - meting_vrijgegeven
    AuditRegel:
      type: object
      required: [id, tijdstip, actor, actorNaam, actorEmail, actie, doelType, doelId, detail]
      properties:
        id: { type: string }
        tijdstip: { type: string, format: date-time }
        actor:
          type: string
          description: Gebruiker.id of the actor, or a non-user value (seed script, `onbekend`, Keycloak sub of a refused login)
        actorNaam:
          type: [string, 'null']
          description: Name of the user behind `actor`; null when `actor` is not a known user
        actorEmail:
          type: [string, 'null']
          description: E-mail of the user behind `actor`; null when `actor` is not a known user
        actie: { $ref: '#/components/schemas/AuditActie' }
        doelType: { type: string }
        doelId: { type: string }
        detail: { type: string }
