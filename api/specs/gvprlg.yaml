openapi: 3.1.0
info:
  title: GVPRLG Volwassenheidsmeting API
  version: 1.0.0-fase-b
security:
  - cookieAuth: []
paths:
  /api/metingen:
    get:
      summary: Lijst alle metingen
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
    post:
      summary: Maak een nieuwe meting aan voor een jaar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jaar]
              properties:
                jaar:
                  type: integer
                  minimum: 2020
                  maximum: 2100
      responses:
        '201':
          description: Aangemaakt
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldige invoer (problem+json)
        '409':
          description: Meting voor dit jaar bestaat al (problem+json)
  /api/metingen/{jaar}:
    get:
      summary: Haal één meting op met status en scores van alle ingevulde platformen
      parameters:
        - name: jaar
          in: path
          required: true
          schema: { type: integer, minimum: 2020, maximum: 2100 }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldig jaar (problem+json)
        '404':
          description: Meting niet gevonden (problem+json)
  /api/metingen/{jaar}/platformen/{platformId}:
    get:
      summary: Haal de scores van één platform binnen een meting op
      parameters:
        - name: jaar
          in: path
          required: true
          schema: { type: integer }
        - name: platformId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldig jaar of platform-id (problem+json)
        '404':
          description: Meting of platform niet gevonden (problem+json)
    put:
      summary: Sla scores en opmerkingen op voor één platform (concept of definitief)
      parameters:
        - name: jaar
          in: path
          required: true
          schema: { type: integer }
        - name: platformId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, vraagScores]
              properties:
                status:
                  type: string
                  enum: [concept, definitief]
                algemeneToelichting:
                  type: string
                vraagScores:
                  type: array
                  items:
                    type: object
                    required: [vraagId, score]
                    properties:
                      vraagId: { type: string }
                      score: { type: integer, minimum: 1, maximum: 5, nullable: true }
                      toelichting: { type: string }
      responses:
        '200':
          description: Opgeslagen
        '401':
          $ref: '#/components/responses/NietIngelogd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '400':
          description: Ongeldige invoer (problem+json)
        '404':
          description: Meting of platform niet gevonden (problem+json)
        '409':
          description: Platform is al definitief; een beheerder moet het eerst heropenen (problem+json)
        '422':
          description: Niet alle vragen ingevuld bij afronden (problem+json)
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >-
        next-auth sessiecookie (HttpOnly, SameSite=Strict), gezet na inloggen via Keycloak.
        Op https heet de cookie `__Secure-next-auth.session-token`. Status, rol en
        platformkoppeling worden per verzoek uit de database gecontroleerd.
  responses:
    NietIngelogd:
      description: Geen geldige sessie (problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GeenToegang:
      description: >-
        Ingelogd maar geen toegang: account niet actief, onvoldoende rol (POST /api/metingen
        vereist beheerder) of geen platformkoppeling (PUT). Wordt geaudit als toegang_geweigerd.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
