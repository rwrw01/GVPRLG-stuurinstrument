# Own project name: docker-compose.yml in this directory also has a 'postgres' service; sharing the
# default project name would make one stack replace the other's container.
name: gvprlg-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: gvprlg-dev-postgres
    environment:
      POSTGRES_USER: gvprlg
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: gvprlg
    ports:
      - "5433:5432"
    volumes:
      - gvprlg-dev-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  # Dev-only Keycloak with the gvprlg realm imported from deploy/keycloak (realm as code).
  # Its embedded dev database lives in the container and import skips an existing realm:
  # after editing the JSON, run `up -d --force-recreate keycloak` to re-import it.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    container_name: gvprlg-dev-keycloak
    command: start-dev --import-realm --http-port=8080
    # Cap memory: the image uses -XX:MaxRAMPercentage=70, so without a limit the JVM heap may grow
    # to 70% of the whole WSL VM. With 1536m the heap tops out around 1 GB.
    mem_limit: 1536m
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: devadmin
      # Same issuer for browser and app: http://localhost:8081/realms/gvprlg
      KC_HOSTNAME: http://localhost:8081
      # Spinnenweb address in the gvprlg themes (invitation mail, "Naar Spinnenweb" link);
      # production leaves it unset and gets the default from the themes' theme.properties.
      SPINNENWEB_URL: http://localhost:3000
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-gvprlg.dev.json:/opt/keycloak/data/import/realm-gvprlg.json:ro
      - ./deploy/keycloak/themes/gvprlg:/opt/keycloak/themes/gvprlg:ro
    depends_on:
      - mailpit

  # Catches all mail sent by the dev Keycloak. SMTP on 1025, web UI and API on 8025.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    container_name: gvprlg-dev-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  gvprlg-dev-pgdata:
