services:
  postgres:
    image: postgres:16-alpine
    container_name: gvprlg-dev-postgres
    environment:
      POSTGRES_USER: gvprlg
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: gvprlg
    ports:
      - "5433:5432"
    volumes:
      - gvprlg-dev-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  gvprlg-dev-pgdata:
