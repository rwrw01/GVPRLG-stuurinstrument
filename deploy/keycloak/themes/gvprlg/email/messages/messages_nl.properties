# Invitation mail (Keycloak execute-actions email), text approved by the product owner.
# Parameters as passed by Keycloak 26.7.5 executeActions.ftl: {0} link, {1} lifetime in minutes,
# {2} realm name, {3} required actions, {4} formatted lifetime (e.g. "3 dagen");
# {5} Spinnenweb address (theme property spinnenwebUrl, added by this theme's executeActions.ftl).
# MessageFormat: a single quote would start a quoted section; these texts contain none.
executeActionsSubject=Uitnodiging voor Spinnenweb van de GVPRLG
executeActionsBody=Geachte heer/mevrouw,\n\nU bent uitgenodigd voor Spinnenweb, de applicatie van de Gebruikersvereniging PinkRoccade Local Government (GVPRLG).\n\nOm de applicatie te gebruiken, registreert u eerst een authenticator-app op uw telefoon, bijvoorbeeld Microsoft Authenticator, Google Authenticator of FreeOTP. Dat gaat zo:\n1. Klik op de link Uitnodiging accepteren.\n{0}\n2. Scan de QR-code met uw authenticator-app.\n3. Vul de code van zes cijfers uit de app in en kies Opslaan.\n\nDe link is {4} geldig.\n\nDaarna logt u in op {5} met uw e-mailadres en de code uit uw authenticator-app.\n\nHeeft u deze uitnodiging niet verwacht? Dan kunt u deze e-mail negeren. Er verandert dan niets.
executeActionsBodyHtml=<p>Geachte heer/mevrouw,</p><p>U bent uitgenodigd voor Spinnenweb, de applicatie van de Gebruikersvereniging PinkRoccade Local Government (GVPRLG).</p><p>Om de applicatie te gebruiken, registreert u eerst een authenticator-app op uw telefoon, bijvoorbeeld Microsoft Authenticator, Google Authenticator of FreeOTP. Dat gaat zo:</p><ol><li>Klik op de link <a href="{0}">Uitnodiging accepteren</a>.</li><li>Scan de QR-code met uw authenticator-app.</li><li>Vul de code van zes cijfers uit de app in en kies Opslaan.</li></ol><p>De link is {4} geldig.</p><p>Daarna logt u in op <a href="{5}">{5}</a> met uw e-mailadres en de code uit uw authenticator-app.</p><p>Heeft u deze uitnodiging niet verwacht? Dan kunt u deze e-mail negeren. Er verandert dan niets.</p>
