# Email theme for realm gvprlg: only the invitation (execute-actions) mail differs from Keycloak's.
parent=keycloak
# Spinnenweb address in the invitation mail. Keycloak substitutes ${env.NAME:default} in theme
# properties; production keeps the default, the dev compose file sets SPINNENWEB_URL.
spinnenwebUrl=${env.SPINNENWEB_URL:https://spinnenweb.gvprlg.nl}
